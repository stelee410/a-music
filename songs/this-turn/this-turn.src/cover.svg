<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#1a1d2b"/>
      <stop offset="1" stop-color="#0b0d14"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8825a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e8825a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- three loops of different lengths, each open where the next one begins -->
  <g fill="none" stroke-linecap="round">
    <circle cx="512" cy="452" r="300" stroke="#5fb8b0" stroke-width="3" stroke-opacity="0.55" stroke-dasharray="188.5 18" transform="rotate(-90 512 452)"/>
    <circle cx="512" cy="452" r="236" stroke="#f4ead8" stroke-width="3" stroke-opacity="0.6" stroke-dasharray="193.8 18" transform="rotate(-64 512 452)"/>
    <circle cx="512" cy="452" r="172" stroke="#e8825a" stroke-width="4" stroke-opacity="0.9" stroke-dasharray="198.1 18" transform="rotate(-38 512 452)"/>
  </g>
  <!-- the question: four rising points; the answer: a line from the last one to the centre -->
  <circle cx="512" cy="452" r="120" fill="url(#glow)"/>
  <path d="M 706 258 Q 640 330 512 452" fill="none" stroke="#e8825a" stroke-width="3" stroke-opacity="0.8"/>
  <g fill="#f4ead8">
    <circle cx="318" cy="646" r="9"/>
    <circle cx="430" cy="560" r="10"/>
    <circle cx="566" cy="402" r="11" fill-opacity="0"/>
    <circle cx="514" cy="492" r="0"/>
    <circle cx="610" cy="350" r="11"/>
    <circle cx="706" cy="258" r="13" fill="#e8825a"/>
  </g>
  <circle cx="512" cy="452" r="16" fill="#f4ead8"/>
  <text x="512" y="872" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="84" font-weight="300" fill="#f4ead8" letter-spacing="14">这一轮</text>
  <text x="512" y="940" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="300" fill="#e8825a" letter-spacing="12">THIS TURN</text>
</svg>
