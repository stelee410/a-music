[workspace]
resolver = "2"
members = [
    "crates/agb-agent",
    "crates/agb-cli",
    "crates/agb-protocol",
    "crates/agb-engine",
    "crates/agb-score",
    "crates/agb-dsp",
    "crates/agb-render",
    "crates/agb-presets",
    "crates/agb-assets",
    "crates/agb-song",
    "crates/agb-plugin",
    "crates/agb-voice",
    "crates/agb-web",
    "crates/agb-android",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
clap = { version = "4", features = ["derive"] }
hound = "3"
sha2 = "0.10"
hex = "0.4"
jsonschema = { version = "0.61", default-features = false }
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

agb-protocol = { path = "crates/agb-protocol" }
agb-engine = { path = "crates/agb-engine" }
agb-score = { path = "crates/agb-score" }
agb-dsp = { path = "crates/agb-dsp" }
agb-render = { path = "crates/agb-render" }
agb-presets = { path = "crates/agb-presets" }
agb-assets = { path = "crates/agb-assets" }
agb-agent = { path = "crates/agb-agent" }
agb-song = { path = "crates/agb-song" }
agb-plugin = { path = "crates/agb-plugin" }
agb-voice = { path = "crates/agb-voice" }
agb-web = { path = "crates/agb-web" }

[profile.test]
opt-level = 2
