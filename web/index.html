<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Groovebox · Web</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23e8825a' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23f4ead8'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <h1>Agent Groovebox <span>web</span></h1>
        <p class="lead">AI 写的曲子，在浏览器里现场合成。</p>
        <ul id="list" class="list"></ul>
        <label class="open">
          <input id="file" type="file" accept=".agbw" hidden />
          打开 .agbw 文件
        </label>
        <p class="hint">也可以把文件拖进窗口。<br />.agbsong 用 <code>agb song web</code> 转换。</p>
      </aside>

      <main class="main">
        <div id="stage" class="stage">
          <canvas id="canvas"></canvas>
          <div id="lyrics" class="lyrics" aria-live="off"></div>
          <button id="big" class="big" aria-label="播放" hidden>
            <svg viewBox="0 0 24 24" width="38" height="38"><path d="M8 5v14l11-7z" fill="currentColor" /></svg>
          </button>
          <div id="busy" class="busy" hidden></div>
          <div id="drop" class="drop" hidden>松开，播放这个文件</div>
        </div>

        <div class="bar">
          <button id="play" class="round" aria-label="播放或暂停" disabled>
            <svg id="icon-play" viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z" fill="currentColor" /></svg>
            <svg id="icon-pause" viewBox="0 0 24 24" width="22" height="22" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" /></svg>
          </button>
          <span id="now" class="time">0:00</span>
          <div id="seek" class="seek" role="slider" tabindex="0" aria-label="进度" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
            <div id="buffered" class="buffered"></div>
            <div id="marks" class="marks"></div>
            <div id="played" class="played"></div>
            <div id="knob" class="knob"></div>
          </div>
          <span id="total" class="time">0:00</span>
          <input id="volume" class="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量" />
          <button id="full" class="flat" aria-label="全屏" title="全屏（F）">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
        </div>

        <section id="about" class="about" hidden>
          <img id="cover" class="cover" alt="" hidden />
          <div class="text">
            <h2 id="title"></h2>
            <p id="byline" class="byline"></p>
            <p id="facts" class="facts"></p>
            <p id="description" class="description"></p>
            <ul id="tracks" class="tracks"></ul>
            <ul id="notes" class="notes"></ul>
          </div>
        </section>
        <p id="error" class="error" hidden></p>
      </main>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
